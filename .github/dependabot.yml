# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python workspace (uv) — packages/* and apps/* share one root uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "[Chore]"
    groups:
      # Only bundle minor/patch bumps together; majors get their own PR
      # each so a breaking change doesn't get buried in a mixed batch.
      uv-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Gateway admin frontend (npm)
  - package-ecosystem: "npm"
    directory: "/apps/gateway_admin/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "[Chore]"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/apps/gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[Chore]"

  - package-ecosystem: "docker"
    directory: "/apps/gateway_admin"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "[Chore]"
